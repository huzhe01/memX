[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ratemem"
version = "0.1.0"
description = "Byte-bounded shared packet memory for image personalization"
requires-python = ">=3.11,<3.12"
dependencies = [
  "accelerate==1.10.1",
  "cbor2==5.7.0",
  "datasets==4.1.1",
  "diffusers==0.35.1",
  "filelock==3.19.1",
  "huggingface-hub==0.34.4",
  "jsonschema==4.25.1",
  "numpy==2.2.6",
  "peft==0.17.1",
  "pillow==11.3.0",
  "pydantic==2.11.7",
  "PyYAML==6.0.2",
  "safetensors==0.6.2",
  "torch==2.8.0",
  "torchvision==0.23.0",
  "transformers==4.56.1",
  "typer==0.16.1",
]

[dependency-groups]
dev = [
  "hypothesis>=6.120,<7",
  "mypy==1.17.1",
  "pytest==8.4.1",
  "ruff==0.12.11",
]

[project.scripts]
ratemem = "ratemem.cli:main"
ratemem-pilot = "ratemem.pilot.cli:main"

[project.optional-dependencies]
modal = [
    "modal==1.5.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ratemem"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
markers = [
  "cuda: requires a CUDA-capable GPU",
  "real_sana: requires the real SANA model",
  "paid_modal: invokes paid Modal infrastructure",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["ratemem"]

[[tool.mypy.overrides]]
module = ["cbor2"]
ignore_missing_imports = true
