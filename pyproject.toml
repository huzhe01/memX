[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ratemem"
version = "0.1.0"
description = "Byte-bounded shared packet memory for image personalization"
requires-python = ">=3.11,<3.12"
dependencies = [
  "accelerate==1.14.0",
  "cbor2==6.1.4",
  "datasets==5.0.1",
  "diffusers==0.40.0",
  "filelock==3.32.4",
  "huggingface-hub==1.29.0",
  "jsonschema==4.26.0",
  "numpy==2.2.6",
  "peft==0.20.0",
  "pillow==12.3.0",
  "pydantic==2.11.7",
  "PyYAML==6.0.2",
  "safetensors==0.8.0",
  "torch==2.13.0",
  "torchvision==0.28.0",
  "transformers==5.16.1",
  "typer==0.27.2",
]

[dependency-groups]
dev = [
  "hypothesis>=6.120,<7",
  "mypy==1.17.1",
  "pytest==9.0.3",
  "ruff==0.12.11",
]

[project.scripts]
ratemem = "ratemem.cli:main"
ratemem-pilot = "ratemem.pilot.cli:main"
ratemem-eval = "ratemem.evaluation.cli:main"
memx = "ratemem.experiment.cli:main"

[project.optional-dependencies]
science = [
  "cryptography==45.0.6",
  "ImageHash==4.3.2",
  "Jinja2==3.1.6",
  "jsonschema==4.26.0",
  "numpy==2.2.6",
  "opencv-python-headless==4.12.0.88",
  "pandas==2.3.2",
  "Pillow==12.3.0",
  "pyarrow==21.0.0",
  "pydantic==2.11.7",
  "PyYAML==6.0.2",
  "scikit-learn==1.7.1",
  "scipy==1.16.1",
  "statsmodels==0.14.5",
]
modal = [
    "modal==1.5.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ratemem"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
markers = [
  "cuda: requires a CUDA device",
  "real_sana: downloads and loads the pinned SANA checkpoint",
  "paid_modal: runs only inside the authorized Modal pilot",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["ratemem"]

[[tool.mypy.overrides]]
module = ["cbor2"]
ignore_missing_imports = true
